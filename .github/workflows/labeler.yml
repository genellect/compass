name: Pull Request Labeler

# Applies the area:* labels defined in .github/labeler.yml from the changed
# paths. The recommended configuration is the pull_request_target trigger
# with no checkout. TEMPORARY: this commit uses pull_request so the initial
# pull request can verify the configuration, as the actions/labeler README
# describes; it is switched back before review.
# Not a required check. See docs/development-workflows.md.

on:
  pull_request:

permissions:
  contents: read

jobs:
  label:
    name: Label changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Adds labels; issues: write lets the action create a missing area label.
      pull-requests: write
      issues: write
    steps:
      - name: Apply area labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: true
