name: Pull Request Labeler

# Applies the area:* labels defined in .github/labeler.yml from the changed
# paths. This is the actions/labeler recommended configuration: the
# pull_request_target trigger with no checkout, so no pull-request content is
# fetched or executed and the configuration is read from the base branch.
# Fork and Dependabot pull requests are labeled as well.
# pull_request_target runs the workflow file of the base branch, so a pull
# request whose base does not contain this file is not labeled.
# Not a required check. See docs/development-workflows.md.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    name: Label changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Adds labels; issues: write lets the action create a missing area label.
      pull-requests: write
      issues: write
    steps:
      - name: Apply area labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: true
