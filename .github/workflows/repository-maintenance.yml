name: Repository Maintenance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:repository
      - run: npm audit --audit-level=moderate
      - name: Generate lockfile SBOM
        run: npm run sbom:npm --silent > test-results/security/npm-sbom.cdx.json
      - name: Retain dependency inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-dependency-inventory
          path: test-results/security/*.json
          retention-days: 7
          if-no-files-found: ignore

  python-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'
      - run: uv sync --project services/library-api --locked --dev
      - run: uv run --project services/library-api --locked python -m unittest discover -s tests -p test_dependency_audit.py
      - run: uv run --project services/library-api --locked python scripts/audit-python-dependencies.py
      - name: Retain dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-audit-${{ matrix.os }}
          path: test-results/security/python-audit.json
          retention-days: 7
          if-no-files-found: ignore
