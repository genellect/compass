name: Repository Maintenance

# Scheduled audit of advisories published against already-merged dependencies.
# It is deliberately not a pull-request gate: a new upstream advisory must not
# block unrelated changes. Pull requests that introduce vulnerable versions are
# rejected by dependency-review in the Library Security Quality Gate, and the
# repository contracts (licenses, toolchain, docs, test wiring) run in ci.yml.

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  npm-audit:
    name: npm advisories and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate lockfile SBOM
        run: |
          mkdir -p test-results/security
          npm run sbom:npm --silent > test-results/security/npm-sbom.cdx.json
      - run: npm audit --audit-level=moderate
      - name: Retain dependency inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-dependency-inventory
          path: test-results/security/*.json
          retention-days: 7
          if-no-files-found: ignore

  python-audit:
    name: Python advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.28'
      - run: uv sync --project services/library-api --locked --dev
      - run: uv run --project services/library-api --locked python -m unittest discover -s tests -p test_dependency_audit.py
      - run: uv run --project services/library-api --locked python scripts/audit-python-dependencies.py
      - name: Retain dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-audit
          path: test-results/security/python-audit.json
          retention-days: 7
          if-no-files-found: ignore
