name: Library Security Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-and-frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Reject private material in public source
        run: npm run verify:public-source
      - name: Reject high-confidence secrets in reachable Git history
        run: npm run verify:git-history-secrets
      - name: Install locked dependencies
        run: npm ci
      - name: Audit installed npm dependencies
        run: npm audit --audit-level=high
      - name: Run registration and release tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Rehearse the production frontend artifact
        run: npm run rehearse:library-production

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/library-api
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: services/library-api/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run the complete API test suite
        run: uv run --locked pytest

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
