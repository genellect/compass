[project]
name = "compass-library-api"
version = "0.1.0"
description = "Registration, identity and access services for the Future Strategy Library"
license = "LicenseRef-COMPASS-Proprietary"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.18.5,<2",
  "cachecontrol>=0.14,<1",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "google-auth>=2.38,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2,<3",
  "psycopg[binary,pool]>=3.3.4,<4",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.51,<2.2",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.4,<10",
  "ruff==0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Stage 1 (2026-10-23): rules that the existing code already passes.
# pycodestyle errors/warnings, Pyflakes and flake8-bugbear.
select = ["E", "F", "W", "B"]
# Held until a dedicated change fixes them (violations at introduction):
# E501 line-too-long 94 at line-length 100 (left to a future formatter decision),
# B008 function-call-in-default-argument 1 (tests/test_phase6_api.py).
# Not selected yet: I001 unsorted-imports 81, UP 17, SIM 8.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
